[package]
name = "comet-reactivity"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
comet-layout.workspace = true
comet-layout-flex.workspace = true
comet-paint.workspace = true
comet-tree.workspace = true

anyrender = "0.15.0"
kurbo = "0.13.1"
reactive_graph = { version = "0.2.16", features = ["effects"] }

[dev-dependencies]
any_spawner = { version = "0.3.0", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
peniko = "0.6.0"
anyrender_vello_cpu = "0.19.0"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
softbuffer_window_renderer = "0.10.0"
winit = { version = "0.30.12", features = ["rwh_06"] }
