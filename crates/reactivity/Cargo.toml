[package]
name = "comet-reactivity"
description = "Fine grained reactive UI building for comet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
comet-layout.workspace = true
comet-layout-flex.workspace = true
comet-paint.workspace = true
comet-tree.workspace = true
comet-accesskit.workspace = true

accesskit = "0.25.2"
anyrender = "0.15.0"
bitflags = "2.10.0"
kurbo = "0.13.1"
parley = "0.13.0"
peniko = "0.6.0"
rustc-hash = "2.1.3"
reactive_graph = { version = "0.2.16", features = ["effects"] }
taffy = { version = "0.15.1", default-features = false, features = ["std"] }

[dev-dependencies]
any_spawner = { version = "0.3.0", features = ["tokio"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "time"] }
