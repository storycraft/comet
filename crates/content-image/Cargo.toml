[package]
name = "comet-content-image"
description = "Image content for comet"
version = { workspace = true }
edition = { workspace = true }
authors = { workspace = true }
license = { workspace = true }

[features]
default = ["reactivity"]
# Bind the image style props to reactive values with `comet-reactivity`.
reactivity = ["dep:comet-reactivity", "dep:reactive_graph"]

[dependencies]
comet-reactivity = { workspace = true, optional = true }
reactive_graph = { workspace = true, optional = true }
anyrender = { workspace = true }
comet-content = { workspace = true }
comet-layout = { workspace = true }
comet-tree = { workspace = true }
kurbo = { workspace = true }
peniko = { workspace = true }
taffy = { workspace = true }

[dev-dependencies]
comet-geometry = { workspace = true }
