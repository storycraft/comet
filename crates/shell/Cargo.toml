[package]
name = "comet-shell"
description = "Reactive windowing and input abstraction for comet"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
comet-accesskit.workspace = true
comet-content.workspace = true
comet-layout.workspace = true
comet-paint.workspace = true
comet-reactivity.workspace = true
comet-tree.workspace = true

accesskit = { workspace = true }
anyrender = { workspace = true }
dpi = "0.1.2"
kurbo = { workspace = true }
parley = { workspace = true }
peniko = { workspace = true }
ui-events = { workspace = true, features = ["kurbo"] }

any_spawner = "0.3.0"
futures = { version = "0.3", default-features = false, features = ["std", "executor"] }
reactive_graph = { workspace = true }
taffy = { workspace = true }
