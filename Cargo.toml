[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["storycraft <storycraft@pancake.sh>"]
license = "Apache-2.0"

[workspace.dependencies]
comet-tree = { path = "./crates/tree" }
comet-slotmap-tree = { path = "./crates/slotmap-tree" }
comet-content = { path = "./crates/content" }
comet-content-image = { path = "./crates/content-image" }
comet-layout = { path = "./crates/layout" }
comet-paint = { path = "./crates/paint" }
comet-accesskit = { path = "./crates/accesskit" }
comet-reactivity = { path = "./crates/reactivity" }
comet-layout-flex = { path = "./crates/layout-flex" }
comet-shell = { path = "./crates/shell" }

accesskit = "0.25.2"
anyrender = "0.15.0"
bitflags = "2.13.2"
kurbo = "0.13.1"
parley = "0.13.0"
peniko = "0.6.0"
reactive_graph = { version = "0.2.16", features = ["effects"] }
slotmap = "1.1.1"
taffy = { version = "0.15.1", default-features = false, features = ["std"] }
ui-events = "0.3.0"
