[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["storycraft <storycraft@pancake.sh>"]
license = "Apache-2.0"

[workspace.dependencies]
comet-tree = { path = "./crates/tree" }
comet-slotmap-tree = { path = "./crates/slotmap-tree" }
comet-layout = { path = "./crates/layout" }
comet-paint = { path = "./crates/paint" }
comet-accesskit = { path = "./crates/accesskit" }

comet-layout-flex = { path = "./crates/layout-flex" }
